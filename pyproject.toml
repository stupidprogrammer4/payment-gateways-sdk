[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-gateways-sdk"
version = "0.1.0"
description = "A unified SDK for payment gateways with both sync and async engines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stupidprogrammer4", email = "ai.goldis111@gmail.com" }]
keywords = [
    "payment",
    "payment-gateway",
    "sdk",
    "async",
    "sync",
    "httpx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
sync = []
async = []
all = ["payment-gateways-sdk[sync,async]"]

[project.urls]
Homepage = "https://github.com/stupidprogrammer4/payment-gateways-sdk"
Repository = "https://github.com/stupidprogrammer4/payment-gateways-sdk"
Issues = "https://github.com/stupidprogrammer4/payment-gateways-sdk/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ruff>=0.6",
    { include-group = "test" },
]
test = [
    "anyio>=4.4",
    "coverage[toml]>=7.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_gateways_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["payment_gateways_sdk"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "sync: tests targeting the sync engine",
    "async: tests targeting the async engine",
    "integration: tests hitting real gateway sandboxes",
]

[tool.coverage.run]
source = ["src/payment_gateways_sdk"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
